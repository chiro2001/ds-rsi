[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-rsi"
version = "0.1.0"
description = "Writable latent memory and continuous context for Qwen3.5"
requires-python = ">=3.11"
dependencies = ["torch>=2.10,<2.11", "numpy>=1.26", "PyYAML>=6"]

[project.optional-dependencies]
model = ["transformers==5.14.1", "safetensors>=0.4"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
